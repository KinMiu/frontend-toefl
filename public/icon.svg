<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#60a5fa" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Graduation Cap Icon & ITB Academic Laurel -->
  <g filter="url(#dropShadow)" transform="translate(64, 76)">
    <!-- Cap Diamond -->
    <path d="M192 48 L352 128 L192 208 L32 128 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Cap Skull Base -->
    <path d="M88 156 L88 236 C88 296, 296 296, 296 236 L296 156 Z" fill="#f8fafc" opacity="0.95"/>

    <!-- Gold Tassel -->
    <path d="M280 172 L320 220 L320 290" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="320" cy="298" r="14" fill="url(#goldGrad)"/>

    <!-- Ribbon / Badge -->
    <rect x="72" y="304" width="240" height="42" rx="21" fill="#0f172a" opacity="0.85"/>
    <text x="192" y="331" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="2">TOEFL ITB 580</text>
  </g>
</svg>
